name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish so every commit gets checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sylvan
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: sylvan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sylvan -d sylvan"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The suite drops and recreates this database; it must end in _test.
      TEST_DATABASE_URL: postgres://sylvan:ci-password@127.0.0.1:5432/sylvan_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      # server and web import @sylvan/shared from its build output, so lint needs it too.
      - run: npm run build -w shared

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:server
      - run: npm run test:web
      - run: npm run build

  docker:
    name: Server image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to sylvan.daftar-e.com
    needs: [check, docker]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://sylvan.daftar-e.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The key is bound to /usr/local/bin/sylvan-deploy on the server (see deploy/ci-deploy.sh);
      # the only thing sent is the commit to deploy.
      - name: Deploy ${{ github.sha }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "root@${DEPLOY_HOST}" "${GITHUB_SHA}"

      - name: Smoke test
        run: |
          for _ in $(seq 1 10); do
            if curl -sfS https://sylvan.daftar-e.com/api/health; then
              echo
              curl -sfS -o /dev/null https://sylvan.daftar-e.com/
              exit 0
            fi
            sleep 3
          done
          echo "https://sylvan.daftar-e.com/api/health is not responding" >&2
          exit 1
